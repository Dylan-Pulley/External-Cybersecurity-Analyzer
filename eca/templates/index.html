<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>External Cybersecurity Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
<main>
  <h1>External Cybersecurity Analyzer</h1>
  <p class="sub">Check a website’s TLS connection and certificate.</p>
  <label for="url">Website</label>
  <form id="f" aria-busy="false">
    <input id="url" name="url" placeholder="example.com" required maxlength="2048" autocomplete="url" aria-describedby="scope">
    <button id="go" type="submit">Check TLS</button>
  </form>
  <p id="scope" class="note">Basic prototype · HTTPS on port 443. Check only sites you are authorized to assess.</p>
  <p id="message" role="status" aria-live="polite"></p>
  <p id="error" class="error" role="alert" hidden></p>
  <section id="out" aria-label="TLS results" hidden>
    <div class="status" id="status"><span class="dot" aria-hidden="true"></span><span id="host"></span></div>
    <p id="summary"></p>
    <div class="grid" id="cards"></div>
    <p class="note">These results describe one TLS connection, not a full security assessment.</p>
  </section>
</main>
</body>
</html>
