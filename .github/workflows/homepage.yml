name: Homepage check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build React
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Check the FastAPI homepage
        run: |
          python -m pip install -r requirements.txt httpx2
          python - <<'PY'
          from fastapi.testclient import TestClient

          from app import app

          with TestClient(app) as client:
              page = client.get("/")
              assert page.status_code == 200, "FastAPI could not serve the homepage"
              assert b"<title>External Cybersecurity Analyzer</title>" in page.content

              reply = client.post("/api/website", json={"website": "https://example.com"})
              assert reply.status_code == 200, reply.text
              assert reply.json() == {"website": "https://example.com"}
          print("FastAPI served the homepage and received the URL.")
          PY
